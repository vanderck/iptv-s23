name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signing: with the four XTREAM_* secrets set (see README), every build is
      # signed with your own key. Without them, a cached debug key is used so
      # updates still install over each other as long as the cache lives.
      - name: Restore fallback signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XTREAM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "XTREAM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "No XTREAM_KEYSTORE_BASE64 secret; signing with the debug key."
          fi

      - name: Test and build
        env:
          XTREAM_KEYSTORE_PASSWORD: ${{ secrets.XTREAM_KEYSTORE_PASSWORD }}
          XTREAM_KEY_ALIAS: ${{ secrets.XTREAM_KEY_ALIAS }}
          XTREAM_KEY_PASSWORD: ${{ secrets.XTREAM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk XtreamTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XtreamTV-apk
          path: XtreamTV.apk

      # Pushes to main refresh the "latest" release, so the newest APK is
      # always one tap away at …/releases/latest-download on the phone.
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest XtreamTV.apk \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA} by run #${GITHUB_RUN_NUMBER}." \
            --target "$GITHUB_SHA" --latest

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" XtreamTV.apk --title "$GITHUB_REF_NAME" --generate-notes
